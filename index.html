<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PAP en escena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500;600;700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root {
    --paper: #E3E1D5;
    --paper-raised: #EDEBE0;
    --ink: #23281F;
    --ink-soft: #55594C;
    --line: #B7B29A;
    --line-strong: #8C876F;
    --pine: #3B6B4A;
    --pine-bg: #DDE7DD;
    --ochre: #92661E;
    --ochre-bg: #EFE3C6;
    --brick: #9A3A28;
    --brick-bg: #EEDAD2;
    --tag-ind: #4A6C8C;
    --tag-col: #6C5B8C;
    --tag-nin: #8C6C3B;
    --tag-ris: #9A3A28;
    --tag-agr: #8C3B5A;
    --tag-may: #3B6B4A;
    --tag-fis: #4A7C7C;
    --shadow: rgba(35,40,31,0.16);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #1B1E17;
      --paper-raised: #23271E;
      --ink: #E7E4D6;
      --ink-soft: #ABA890;
      --line: #4A4C3E;
      --line-strong: #6A6C56;
      --pine: #7FBF93;
      --pine-bg: #223026;
      --ochre: #D8AE5C;
      --ochre-bg: #332A17;
      --brick: #E08A72;
      --brick-bg: #3A241E;
      --shadow: rgba(0,0,0,0.4);
    }
  }
  :root[data-theme="dark"] {
    --paper: #1B1E17;
    --paper-raised: #23271E;
    --ink: #E7E4D6;
    --ink-soft: #ABA890;
    --line: #4A4C3E;
    --line-strong: #6A6C56;
    --pine: #7FBF93;
    --pine-bg: #223026;
    --ochre: #D8AE5C;
    --ochre-bg: #332A17;
    --brick: #E08A72;
    --brick-bg: #3A241E;
    --shadow: rgba(0,0,0,0.4);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Work Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    line-height: 1.5;
    min-height: 100vh;
  }

  .wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: 28px 20px 80px;
  }

  header.topbar {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    border-bottom: 2px solid var(--line-strong);
    padding-bottom: 16px;
    margin-bottom: 22px;
    flex-wrap: wrap;
  }

  h1.brand {
    font-family: "Zilla Slab", Georgia, serif;
    font-weight: 700;
    font-size: 1.7rem;
    margin: 0;
    letter-spacing: 0.2px;
  }

  .brand-sub {
    font-size: 0.85rem;
    color: var(--ink-soft);
    margin-top: 2px;
  }

  nav.toplinks {
    display: flex;
    gap: 14px;
  }

  nav.toplinks button {
    background: none;
    border: none;
    color: var(--ink-soft);
    font-family: "Work Sans", sans-serif;
    font-size: 0.85rem;
    cursor: pointer;
    padding: 4px 0;
    border-bottom: 1px solid transparent;
  }
  nav.toplinks button:hover, nav.toplinks button:focus-visible {
    color: var(--ink);
    border-bottom-color: var(--ink);
  }

  .note {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-left: 4px solid var(--ochre);
    padding: 12px 14px;
    font-size: 0.85rem;
    color: var(--ink-soft);
    margin-bottom: 24px;
  }
  .note strong { color: var(--ink); }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 22px;
  }
  .chip {
    font-family: "Work Sans", sans-serif;
    font-size: 0.8rem;
    padding: 6px 13px;
    border: 1px solid var(--line-strong);
    background: transparent;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .chip.active {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 14px;
  }

  .card {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-top: 4px solid var(--cat-color, var(--line-strong));
    padding: 16px;
    cursor: pointer;
    text-align: left;
    font-family: inherit;
    color: inherit;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .card:hover, .card:focus-visible {
    box-shadow: 0 3px 10px var(--shadow);
    outline: none;
  }
  .card .cat-label {
    font-size: 0.72rem;
    color: var(--cat-color, var(--ink-soft));
    font-weight: 600;
  }
  .card h3 {
    font-family: "Zilla Slab", Georgia, serif;
    font-size: 1.05rem;
    margin: 0;
    font-weight: 600;
  }
  .card .protocol-badge {
    font-size: 0.72rem;
    color: var(--ink-soft);
    margin-top: auto;
  }

  /* Scenario view */
  .back-btn {
    background: none;
    border: none;
    color: var(--ink-soft);
    font-size: 0.85rem;
    cursor: pointer;
    padding: 0;
    margin-bottom: 16px;
    font-family: "Work Sans", sans-serif;
  }
  .back-btn:hover { color: var(--ink); }

  .scenario-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 14px;
  }
  .badge {
    font-size: 0.72rem;
    padding: 4px 10px;
    border: 1px solid var(--line-strong);
    color: var(--ink-soft);
  }

  .report-box {
    background: var(--paper-raised);
    border: 1px solid var(--line-strong);
    padding: 18px;
    margin-bottom: 24px;
    position: relative;
  }
  .report-box .report-label {
    font-size: 0.72rem;
    color: var(--ink-soft);
    margin-bottom: 8px;
    display: block;
  }
  .report-box p {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.92rem;
    line-height: 1.6;
    margin: 0;
  }

  h2.prompt {
    font-family: "Zilla Slab", Georgia, serif;
    font-size: 1.2rem;
    margin: 0 0 12px;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 18px;
  }
  .option-row {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    text-align: left;
    background: var(--paper-raised);
    border: 1px solid var(--line);
    padding: 12px 14px;
    cursor: pointer;
    font-family: "Work Sans", sans-serif;
    font-size: 0.95rem;
    color: var(--ink);
  }
  .option-row:hover:not(:disabled) {
    border-color: var(--line-strong);
  }
  .option-row .marker {
    flex-shrink: 0;
    width: 22px;
    height: 22px;
    border: 1.5px solid var(--line-strong);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    margin-top: 1px;
  }
  .option-row:disabled { cursor: default; }
  .option-row.chosen.correcto { border-left: 4px solid var(--pine); background: var(--pine-bg); }
  .option-row.chosen.parcial { border-left: 4px solid var(--ochre); background: var(--ochre-bg); }
  .option-row.chosen.incorrecto { border-left: 4px solid var(--brick); background: var(--brick-bg); }
  .option-row.unchosen { opacity: 0.55; }

  .feedback {
    margin-top: -4px;
    margin-bottom: 20px;
    padding: 16px 18px;
    border: 1px solid var(--line-strong);
  }
  .feedback.correcto { border-left: 5px solid var(--pine); background: var(--pine-bg); }
  .feedback.parcial { border-left: 5px solid var(--ochre); background: var(--ochre-bg); }
  .feedback.incorrecto { border-left: 5px solid var(--brick); background: var(--brick-bg); }
  .feedback .verdict {
    font-family: "Zilla Slab", Georgia, serif;
    font-weight: 700;
    font-size: 1rem;
    margin-bottom: 6px;
  }
  .feedback .verdict.correcto { color: var(--pine); }
  .feedback .verdict.parcial { color: var(--ochre); }
  .feedback .verdict.incorrecto { color: var(--brick); }
  .feedback p { margin: 0; font-size: 0.92rem; }

  .cierre {
    font-size: 0.88rem;
    color: var(--ink-soft);
    border-top: 1px solid var(--line);
    padding-top: 14px;
    margin-bottom: 20px;
  }
  .cierre strong { color: var(--ink); }

  .actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .actions button {
    font-family: "Work Sans", sans-serif;
    font-size: 0.85rem;
    padding: 10px 16px;
    cursor: pointer;
    border: 1px solid var(--line-strong);
    background: transparent;
    color: var(--ink);
  }
  .actions button.primary {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }
  .actions button:hover { box-shadow: 0 2px 8px var(--shadow); }

  /* Protocol reference view */
  .protocol-steps {
    list-style: none;
    margin: 0;
    padding: 0;
    counter-reset: step;
  }
  .protocol-steps li {
    counter-increment: step;
    display: flex;
    gap: 14px;
    padding: 14px 0;
    border-bottom: 1px solid var(--line);
  }
  .protocol-steps li:last-child { border-bottom: none; }
  .protocol-steps li::before {
    content: counter(step);
    font-family: "Zilla Slab", Georgia, serif;
    font-weight: 700;
    font-size: 1.3rem;
    color: var(--ink-soft);
    width: 28px;
    flex-shrink: 0;
  }
  .protocol-steps .step-name {
    font-weight: 600;
    display: block;
    margin-bottom: 2px;
  }
  .protocol-steps .step-desc {
    font-size: 0.9rem;
    color: var(--ink-soft);
  }

  .protocol-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }
  .protocol-tabs button {
    flex: 1;
    font-family: "Work Sans", sans-serif;
    font-size: 0.9rem;
    padding: 10px;
    border: 1px solid var(--line-strong);
    background: transparent;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .protocol-tabs button.active {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }

  footer.foot {
    margin-top: 40px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    font-size: 0.78rem;
    color: var(--ink-soft);
  }

  @media (max-width: 480px) {
    .wrap { padding: 20px 14px 60px; }
    h1.brand { font-size: 1.4rem; }
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
const CATEGORIES = {
  crisis_individual: { label: "Crisis individual", color: "var(--tag-ind)" },
  crisis_colectiva: { label: "Crisis colectiva", color: "var(--tag-col)" },
  ninos: { label: "Niños", color: "var(--tag-nin)" },
  riesgo_autolesion: { label: "Riesgo de autolesión", color: "var(--tag-ris)" },
  agresividad: { label: "Agresividad", color: "var(--tag-agr)" },
  adultos_mayores: { label: "Adultos mayores", color: "var(--tag-may)" },
  riesgo_fisico_concurrente: { label: "Físico + emocional", color: "var(--tag-fis)" }
};

// ── Link de la hoja de cálculo ──────────────────────────────────────────
// Pega aquí la URL que da Google Sheets al usar Archivo → Compartir →
// Publicar en la web → eligiendo la hoja de escenarios y formato CSV.
// Si se deja vacío, o si la carga falla, la app sigue funcionando con
// los escenarios de respaldo (DEFAULT_SCENARIOS) definidos abajo.
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQrIPEamdKYi37bmBawHawThglTGDfOtWIx80Z0OBpUBuYy09CTtKitw9hhAwAKKOac2hmTNowG8ghe/pubhtml";

const DEFAULT_SCENARIOS = [
  {
    id: "escenario_01",
    titulo: "Accidente de tránsito con persona en shock",
    categoria: "crisis_individual",
    protocolo_asociado: "ABCDE",

      {
        narrativa: "Llegas al lugar de un accidente de moto. El conductor está sentado en el andén, consciente, sin heridas visibles graves, pero no responde cuando le hablas y tiene la mirada perdida.",
        opciones: [
          { texto: "Te acercas de inmediato y empiezas a hacerle preguntas sobre lo que pasó.", nivel_acierto: "parcial", retroalimentacion: "El contacto es correcto, pero antes de indagar sobre el evento conviene primero establecer una conexión básica y verificar orientación, ya que puede estar en shock disociativo." },
          { texto: "Verificas primero que no haya riesgo físico inmediato (tránsito, fugas, etc.) antes de acercarte.", nivel_acierto: "correcto", retroalimentacion: "Correcto: la seguridad de la escena y de quien interviene siempre precede al contacto psicológico, incluso cuando la urgencia emocional parece prioritaria." },
          { texto: "Esperas a que él hable primero, sin acercarte ni decir nada.", nivel_acierto: "incorrecto", retroalimentacion: "Una persona en shock puede no iniciar contacto por sí misma; el protocolo requiere una aproximación activa pero calmada, no pasividad." },
          { texto: "Llamas refuerzos antes de hacer cualquier otra cosa.", nivel_acierto: "parcial", retroalimentacion: "Pedir apoyo es válido y a veces necesario, pero no debería reemplazar la evaluación inmediata de la escena y el primer contacto si estás en capacidad de hacerlo." }
        ]
      },
      {
        narrativa: "Confirmas que la escena es segura y te acercas al conductor. Al hablarle no obtienes respuesta verbal: solo te mira fijamente, sin decir nada.",
        opciones: [
          { texto: "Te presentas con voz calmada, dices tu nombre y que estás ahí para ayudar, sin exigirle que responda de inmediato.", nivel_acierto: "correcto", retroalimentacion: "Correcto: presentarte y sostener presencia calmada da tiempo a que la persona reaccione a su propio ritmo, sin forzar una respuesta que aún no puede dar." },
          { texto: "Le tocas el hombro para llamar su atención antes de seguir hablándole.", nivel_acierto: "parcial", retroalimentacion: "El contacto físico puede ayudar, pero conviene anunciarlo verbalmente antes de tocar a alguien que está desconectado, para no sobresaltarlo." },
          { texto: "Le repites la misma pregunta varias veces, cada vez más fuerte.", nivel_acierto: "incorrecto", retroalimentacion: "Elevar el tono y repetir la pregunta no ayuda a alguien en shock a reconectar; puede aumentar la desorientación." },
          { texto: "Te sientas a su lado en silencio, sin decir nada, esperando que reaccione por sí solo.", nivel_acierto: "parcial", retroalimentacion: "Acompañar en silencio no está mal, pero en esta fase el protocolo busca una aproximación activa: anunciarte y ofrecer contacto verbal simple." }
        ]
      },
      {
        narrativa: "Después de un momento, el conductor empieza a respirar muy rápido y te dice que siente que se va a desmayar.",
        opciones: [
          { texto: "Lo guías a respirar despacio, contando en voz alta junto con él y manteniendo contacto visual.", nivel_acierto: "correcto", retroalimentacion: "Correcto: guiar activamente la respiración con una referencia externa (contar en voz alta) ayuda a regular la hiperventilación de forma concreta." },
          { texto: "Le dices que se calme porque no es nada grave.", nivel_acierto: "incorrecto", retroalimentacion: "Minimizar lo que siente no reduce la hiperventilación y puede hacer que se sienta poco escuchado." },
          { texto: "Le sugieres que se acueste y vas a buscar a alguien más sin quedarte con él.", nivel_acierto: "parcial", retroalimentacion: "Buscar apoyo adicional es válido, pero dejarlo solo justo cuando está hiperventilando interrumpe la regulación que ya se había iniciado." },
          { texto: "Le das agua rápidamente sin decir nada sobre su respiración.", nivel_acierto: "incorrecto", retroalimentacion: "El agua no atiende la causa inmediata (hiperventilación); el protocolo requiere abordar la respiración de forma directa." }
        ]
      }
    ],
    cierre: "Este escenario recorre tres momentos clave de ABCDE: asegurar el entorno, establecer contacto sin forzar respuesta, y regular una crisis fisiológica (hiperventilación) cuando aparece."
  },
  {
    id: "escenario_02",
    titulo: "Evacuación con varias personas alteradas",
    categoria: "crisis_colectiva",
    protocolo_asociado: "ACERCARSE",
    momentos: [
      {
        narrativa: "Durante una evacuación por incendio en un edificio, un grupo de 5 personas está reunido en la calle. Algunas lloran, otras hablan muy rápido y una persona grita pidiendo volver a entrar por una mascota.",
        opciones: [
          { texto: "Te diriges primero a la persona que grita, ya que representa el mayor riesgo inmediato.", nivel_acierto: "correcto", retroalimentacion: "Correcto: en un grupo, se prioriza a quien representa mayor riesgo de acción impulsiva (como intentar reingresar), antes de atender reacciones emocionales sin riesgo físico asociado." },
          { texto: "Te diriges al grupo completo con un mensaje general de calma antes de individualizar.", nivel_acierto: "parcial", retroalimentacion: "Dar un mensaje grupal de calma es válido, pero no debe retrasar la atención inmediata a quien está en riesgo de actuar de forma peligrosa." },

          { texto: "Te acercas a quienes lloran primero, porque parecen necesitar más apoyo emocional.", nivel_acierto: "parcial", retroalimentacion: "El llanto no siempre indica el mayor riesgo; priorizar por riesgo físico o de seguridad suele ir antes que por intensidad emocional aparente." }

      },
      {

        opciones: [
          { texto: "La dejas ir, entendiendo que necesita comunicarse con su familia.", nivel_acierto: "incorrecto", retroalimentacion: "Permitir que se aleje sola del punto seguro, aunque el motivo sea válido, expone a la persona a un riesgo evitable mientras la situación sigue activa." },
          { texto: "La acompañas mientras busca señal o hace la llamada, sin impedirle comunicarse pero sin perderla de vista.", nivel_acierto: "correcto", retroalimentacion: "Correcto: se valida una necesidad legítima sin dejar de sostener la contención y la seguridad; acompañar es preferible a prohibir o ignorar." },
          { texto: "Le quitas el teléfono para evitar que se aleje.", nivel_acierto: "incorrecto", retroalimentacion: "Una acción impositiva sobre las pertenencias de la persona vulnera su autonomía y puede escalar la agitación en lugar de reducirla." },
          { texto: "Le explicas que primero debe terminar la evacuación y que podrá llamar después.", nivel_acierto: "parcial", retroalimentacion: "Priorizar el procedimiento es razonable, pero descartar sin más la urgencia emocional de contactar a la familia puede generar más resistencia que cooperación." }
        ]
      },
      {
        narrativa: "Mientras te alejas del grupo, ya más calmado, otra persona te reclama en tono agresivo que 'nadie está haciendo nada' y se te planta enfrente bloqueándote el paso.",
        opciones: [
          { texto: "Mantienes un tono calmado, reconoces su frustración y le explicas brevemente qué se está haciendo, sin discutir.", nivel_acierto: "correcto", retroalimentacion: "Correcto: validar la frustración sin entrar en confrontación mantiene la contención del grupo y evita escalar un conflicto adicional en medio de la crisis." },
          { texto: "Le respondes en el mismo tono elevado para dejar claro que no puede hablarte así.", nivel_acierto: "incorrecto", retroalimentacion: "Igualar el tono confrontativo aumenta la tensión justo cuando el objetivo es reducir la activación general del grupo." },
          { texto: "Te disculpas repetidamente sin darle ninguna información concreta.", nivel_acierto: "parcial", retroalimentacion: "Disculparse sin aportar información no resuelve la frustración; una explicación breve suele ser más efectiva que solo disculpas." },
          { texto: "La ignoras y sigues caminando sin responder.", nivel_acierto: "incorrecto", retroalimentacion: "Ignorar por completo a alguien alterado que te confronta directamente puede escalar la situación en lugar de contenerla." }
        ]
      }
    ],
    cierre: "Este escenario recorre tres momentos de ACERCARSE con un grupo: priorizar por riesgo, sostener una necesidad emocional legítima sin perder la contención, y manejar una confrontación sin escalar el conflicto."
  },
  {

      {

        opciones: [
          { texto: "Te agachas a su altura, le hablas con voz calmada y te presentas antes de hacer preguntas.", nivel_acierto: "correcto", retroalimentacion: "Correcto: con niños, el contacto psicológico requiere ajustar el lenguaje corporal (altura, tono) antes de indagar información, para reducir el miedo inicial." },
          { texto: "Le preguntas de inmediato el nombre completo de sus padres para buscarlos.", nivel_acierto: "parcial", retroalimentacion: "La información es necesaria, pero pedirla antes de establecer algo de calma puede aumentar la angustia del niño en ese momento." },

const CATEGORIAS_VALIDAS = Object.keys(CATEGORIES);
const PROTOCOLOS_VALIDOS = ["ACERCARSE", "ABCDE"];
const NIVELES_VALIDOS = ["correcto", "parcial", "incorrecto"];

function filasAEscenarios(filas) {
  const porId = new Map();
  const orden = [];

  filas.forEach(row => {
    const id = (row.id_escenario || "").trim();
    if (!id) return;
    const categoria = (row.categoria || "").trim();
    const protocolo = (row.protocolo || "").trim();
    if (!CATEGORIAS_VALIDAS.includes(categoria)) {
      console.warn(`Fila de "${id}" ignorada: categoría "${categoria}" no reconocida.`);
      return;
    }
    if (!PROTOCOLOS_VALIDOS.includes(protocolo)) {
      console.warn(`Fila de "${id}" ignorada: protocolo "${protocolo}" no reconocido.`);
      return;
    }

    const opciones = [];
    for (let i = 1; i <= 4; i++) {
      const texto = (row["opcion" + i + "_texto"] || "").trim();
      if (!texto) continue;
      const nivel = (row["opcion" + i + "_nivel"] || "").trim();
      if (!NIVELES_VALIDOS.includes(nivel)) {
        console.warn(`Fila de "${id}", opción ${i} ignorada: nivel "${nivel}" no reconocido.`);
        continue;
      }
      opciones.push({ texto, nivel_acierto: nivel, retroalimentacion: (row["opcion" + i + "_retro"] || "").trim() });
    }
    if (opciones.length < 2) {
      console.warn(`Fila de "${id}" ignorada: necesita al menos 2 opciones válidas.`);
      return;
    }

    if (!porId.has(id)) {
      porId.set(id, {
        id,
        titulo: (row.titulo || "").trim(),
        categoria,
        protocolo_asociado: protocolo,
        cierre: "",
        _momentos: []
      });
      orden.push(id);
    }
    const escenario = porId.get(id);
    const numero = parseInt(row.numero_momento, 10) || (escenario._momentos.length + 1);
    escenario._momentos.push({ numero, narrativa: (row.narrativa || "").trim(), opciones });
    const cierre = (row.cierre || "").trim();
    if (cierre) escenario.cierre = cierre;
  });

  const resultado = [];
  orden.forEach(id => {
    const e = porId.get(id);
    e._momentos.sort((a, b) => a.numero - b.numero);
    const momentos = e._momentos.map(m => ({ narrativa: m.narrativa, opciones: m.opciones }));
    if (momentos.length === 0) return;
    resultado.push({
      id: e.id,
      titulo: e.titulo,
      categoria: e.categoria,
      protocolo_asociado: e.protocolo_asociado,
      momentos,
      cierre: e.cierre
    });
  });
  return resultado;
}

function cargarEscenariosDesdeHoja() {
  if (!SHEET_CSV_URL || typeof Papa === "undefined") return;
  fetch(SHEET_CSV_URL)
    .then(res => { if (!res.ok) throw new Error("HTTP " + res.status); return res.text(); })
    .then(texto => {
      const parsed = Papa.parse(texto, { header: true, skipEmptyLines: true });
      const escenarios = filasAEscenarios(parsed.data);
      if (escenarios.length === 0) {
        console.warn("La hoja no produjo ningún escenario válido; se mantiene el respaldo.");
        return;
      }
      SCENARIOS = escenarios;
      if (state.view === "home") render();
    })
    .catch(err => {
      console.warn("No se pudo cargar la hoja de escenarios, se mantiene el respaldo:", err);
    });
}

const PROTOCOLS = {
  ACERCARSE: {
    nombre: "ACERCARSE",
    fuente: "Muñoz, Ausín y Pérez-Santos (2004/2007)",
    nota: "Las fuentes académicas describen 8 etapas para este protocolo. Si en el curso lo vieron como 9 pasos, conviene ajustar esta lista con el material exacto de la instructora antes de usarla como referencia final.",
    pasos: [
      { nombre: "Ambiente", desc: "Hacerse una imagen general de la escena: qué ocurrió, quiénes están presentes y qué necesidades inmediatas hay." },
      { nombre: "Contacto", desc: "Establecer una relación de respeto y distanciamiento psicológico adecuado con la persona afectada." },
      { nombre: "Evaluación", desc: "Valorar el estado de la persona: nivel de afectación, riesgo y recursos con los que cuenta." },
      { nombre: "Restablecimiento emocional", desc: "Ayudar a reducir la activación emocional mediante escucha activa y técnicas de desactivación fisiológica." },
      { nombre: "Comprensión de la crisis", desc: "Facilitar que la persona entienda lo ocurrido y normalice sus reacciones ante el evento." },
      { nombre: "Activación de recursos", desc: "Identificar y movilizar la red de apoyo social y los recursos personales de la persona." },
      { nombre: "Recuperación del funcionamiento", desc: "Apoyar la vuelta a actividades básicas y la toma de decisiones prácticas inmediatas." },
      { nombre: "Seguimiento", desc: "Plantear un seguimiento a corto o mediano plazo, o derivar si el caso lo requiere." }
    ]
  },
  ABCDE: {
    nombre: "ABCDE",
    fuente: "Referencia general del curso — pendiente de contrastar con el manual exacto",
    nota: "Este protocolo se enseña con contenido específico del curso. Los pasos que siguen son un esquema general de trabajo y deben reemplazarse por la secuencia exacta y la terminología que usó la instructora antes de tomarlos como referencia final.",
    pasos: [
      { nombre: "Seguridad del entorno", desc: "Confirmar que la escena es segura para intervenir, tanto para la persona afectada como para quien ayuda." },
      { nombre: "Contacto y contención inicial", desc: "Aproximarse con calma, presentarse y ofrecer una presencia estable." },
      { nombre: "Evaluación breve", desc: "Identificar el estado físico y emocional de la persona, y detectar señales de riesgo." },
      { nombre: "Desactivación / regulación", desc: "Aplicar técnicas simples de respiración o anclaje para reducir la activación." },
      { nombre: "Enlace y cierre", desc: "Conectar a la persona con su red de apoyo o los servicios pertinentes, y cerrar la intervención." }
    ]
  }
};

let state = { view: "home", filter: "todas", scenarioId: null, momentoIndex: 0, chosenIndex: null, protocolTab: "ACERCARSE" };

function render() {
  const app = document.getElementById("app");
  app.innerHTML = "";
  app.appendChild(buildHeader());
  if (state.view === "home") app.appendChild(buildHome());
  else if (state.view === "scenario") app.appendChild(buildScenario());
  else if (state.view === "protocols") app.appendChild(buildProtocols());
  app.appendChild(buildFooter());
}

function buildHeader() {
  const header = document.createElement("header");
  header.className = "topbar";
  header.innerHTML = `
    <div>
      <h1 class="brand">PAP en escena</h1>
      <div class="brand-sub">Escenarios de decisión — Psicología en la emergencia</div>
    </div>
    <nav class="toplinks">
      <button data-nav="home">Escenarios</button>
      <button data-nav="protocols">Protocolos</button>
    </nav>
  `;
  header.querySelector('[data-nav="home"]').onclick = () => { state.view = "home"; render(); };
  header.querySelector('[data-nav="protocols"]').onclick = () => { state.view = "protocols"; render(); };
  return header;
}

function buildFooter() {
  const f = document.createElement("footer");
  f.className = "foot";
  f.textContent = "Prototipo de práctica de decisión para el curso — contenido de escenarios y protocolos en borrador, pendiente de validar contra el material exacto de la instructora.";
  return f;
}

function buildHome() {
  const frag = document.createElement("div");

  const note = document.createElement("div");
  note.className = "note";
  note.innerHTML = `<strong>Nota:</strong> los escenarios y protocolos de referencia son un borrador de trabajo. Revísalos y ajústalos con el contenido exacto visto en clase antes de usarlos como material final.`;
  frag.appendChild(note);

  const chips = document.createElement("div");
  chips.className = "chips";
  const allCats = ["todas", ...Object.keys(CATEGORIES)];
  allCats.forEach(cat => {
    const btn = document.createElement("button");
    btn.className = "chip" + (state.filter === cat ? " active" : "");
    btn.textContent = cat === "todas" ? "Todas" : CATEGORIES[cat].label;
    btn.onclick = () => { state.filter = cat; render(); };
    chips.appendChild(btn);
  });
  frag.appendChild(chips);

  const grid = document.createElement("div");
  grid.className = "grid";
  const list = state.filter === "todas" ? SCENARIOS : SCENARIOS.filter(s => s.categoria === state.filter);
  list.forEach(s => {
    const cat = CATEGORIES[s.categoria];
    const card = document.createElement("button");
    card.className = "card";
    card.style.setProperty("--cat-color", cat.color);
    card.innerHTML = `
      <span class="cat-label">${cat.label}</span>
      <h3>${s.titulo}</h3>
      <span class="protocol-badge">Protocolo: ${s.protocolo_asociado}</span>
    `;
    card.onclick = () => { state.view = "scenario"; state.scenarioId = s.id; state.momentoIndex = 0; state.chosenIndex = null; render(); };
    grid.appendChild(card);
  });
  frag.appendChild(grid);

  return frag;
}

function buildScenario() {
  const s = SCENARIOS.find(x => x.id === state.scenarioId);
  const cat = CATEGORIES[s.categoria];
  const frag = document.createElement("div");

  const back = document.createElement("button");
  back.className = "back-btn";
  back.textContent = "‹ Volver a escenarios";
  back.onclick = () => { state.view = "home"; render(); };
  frag.appendChild(back);

  const head = document.createElement("div");
  head.className = "scenario-header";
  head.innerHTML = `
    <h2 class="prompt" style="margin:0;">${s.titulo}</h2>
    <div style="display:flex; gap:8px;">
      <span class="badge" style="color:${cat.color};border-color:${cat.color};">${cat.label}</span>
      <span class="badge">${s.protocolo_asociado}</span>
    </div>
  `;
  frag.appendChild(head);

  const totalMomentos = s.momentos.length;
  if (totalMomentos > 1) {
    const progreso = document.createElement("div");
    progreso.style.cssText = "font-size:0.78rem;color:var(--ink-soft);margin-bottom:10px;";
    progreso.textContent = `Momento ${state.momentoIndex + 1} de ${totalMomentos}`;
    frag.appendChild(progreso);
  }

  const momento = s.momentos[state.momentoIndex];

  const report = document.createElement("div");
  report.className = "report-box";
  report.innerHTML = `<span class="report-label">Reporte de escena</span><p>${momento.narrativa}</p>`;
  frag.appendChild(report);

  const q = document.createElement("h2");
  q.className = "prompt";
  q.textContent = "¿Qué haces?";
  frag.appendChild(q);

  const opts = document.createElement("div");
  opts.className = "options";
  const letters = ["A", "B", "C", "D"];
  momento.opciones.forEach((op, i) => {
    const row = document.createElement("button");
    row.className = "option-row";
    if (state.chosenIndex !== null) {
      row.disabled = true;
      if (i === state.chosenIndex) row.classList.add("chosen", op.nivel_acierto);
      else row.classList.add("unchosen");
    }
    row.innerHTML = `<span class="marker">${letters[i]}</span><span>${op.texto}</span>`;
    row.onclick = () => { if (state.chosenIndex === null) { state.chosenIndex = i; render(); } };
    opts.appendChild(row);
  });
  frag.appendChild(opts);

  if (state.chosenIndex !== null) {
    const chosen = momento.opciones[state.chosenIndex];
    const fb = document.createElement("div");
    fb.className = "feedback " + chosen.nivel_acierto;
    const verdictLabel = chosen.nivel_acierto === "correcto" ? "Correcto" : chosen.nivel_acierto === "parcial" ? "Parcial" : "Incorrecto";
    fb.innerHTML = `<div class="verdict ${chosen.nivel_acierto}">${verdictLabel}</div><p>${chosen.retroalimentacion}</p>`;
    frag.appendChild(fb);

    const esUltimoMomento = state.momentoIndex === totalMomentos - 1;

    if (!esUltimoMomento) {
      const actions = document.createElement("div");
      actions.className = "actions";
      const siguienteMomento = document.createElement("button");
      siguienteMomento.className = "primary";
      siguienteMomento.textContent = "Siguiente momento";
      siguienteMomento.onclick = () => { state.momentoIndex += 1; state.chosenIndex = null; render(); window.scrollTo(0,0); };
      actions.appendChild(siguienteMomento);
      frag.appendChild(actions);
      return frag;
    }

    const cierre = document.createElement("div");
    cierre.className = "cierre";
    cierre.innerHTML = `<strong>Para llevar:</strong> ${s.cierre}`;
    frag.appendChild(cierre);

    const actions = document.createElement("div");
    actions.className = "actions";

    const verProtocolo = document.createElement("button");
    verProtocolo.textContent = "Ver protocolo completo";
    verProtocolo.onclick = () => { state.view = "protocols"; state.protocolTab = s.protocolo_asociado; render(); };
    actions.appendChild(verProtocolo);

    const currentIdx = SCENARIOS.findIndex(x => x.id === s.id);
    if (currentIdx < SCENARIOS.length - 1) {
      const next = document.createElement("button");
      next.className = "primary";
      next.textContent = "Siguiente escenario";
      next.onclick = () => { state.scenarioId = SCENARIOS[currentIdx + 1].id; state.momentoIndex = 0; state.chosenIndex = null; render(); window.scrollTo(0,0); };
      actions.appendChild(next);
    }

    const menu = document.createElement("button");
    menu.textContent = "Volver al menú";
    menu.onclick = () => { state.view = "home"; render(); };
    actions.appendChild(menu);

    frag.appendChild(actions);
  }

  return frag;
}

function buildProtocols() {
  const frag = document.createElement("div");

  const tabs = document.createElement("div");
  tabs.className = "protocol-tabs";
  Object.keys(PROTOCOLS).forEach(key => {
    const btn = document.createElement("button");
    btn.textContent = key;
    btn.className = state.protocolTab === key ? "active" : "";
    btn.onclick = () => { state.protocolTab = key; render(); };
    tabs.appendChild(btn);
  });
  frag.appendChild(tabs);

  const p = PROTOCOLS[state.protocolTab];

  const note = document.createElement("div");
  note.className = "note";
  note.innerHTML = `<strong>Fuente:</strong> ${p.fuente}. ${p.nota}`;
  frag.appendChild(note);

  const list = document.createElement("ol");
  list.className = "protocol-steps";
  p.pasos.forEach(paso => {
    const li = document.createElement("li");
    li.innerHTML = `<div><span class="step-name">${paso.nombre}</span><span class="step-desc">${paso.desc}</span></div>`;
    list.appendChild(li);
  });
  frag.appendChild(list);

  return frag;
}

render();
cargarEscenariosDesdeHoja();
</script>
</body>
</html>
